name: Build & Publish Klipboard DMG

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Klipboard.app and drag-and-drop DMG
        run: ./build-release.sh

      - name: Publish DMG to GitHub Releases (v0.1.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Klipboard v0.1.0
          files: dist/Klipboard-*.dmg
          generate_release_notes: true
